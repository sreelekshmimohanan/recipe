
{% block content %}
{% load static %}

{% include 'header.html' %}
<style>
    .description-scroll {
    max-height: 100px; /* Set the maximum height for the description */
    overflow-y: auto; /* Enable vertical scrollbar if needed */
}

.item-description {
    margin-bottom: 0; /* Remove default margin to prevent extra space */
}
</style>

<!-- Page Header Start -->
    <div class="container-fluid page-header mb-5 wow fadeIn" data-wow-delay="0.1s">
        <div class="container">
            <h1 class="display-3 mb-3 animated slideInDown">Recipes</h1>
            <nav aria-label="breadcrumb animated slideInDown">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a class="text-body" href="#">Home</a></li>
                    <li class="breadcrumb-item"><a class="text-body" href="#">Pages</a></li>
                    <li class="breadcrumb-item text-dark active" aria-current="page">Recipe</li>
                </ol>
            </nav>
        </div>
    </div>
    <!-- Page Header End -->
<!-- Product Start -->
<div class="container-xxl py-5">
    <div class="container">
        <div class="row g-0 gx-5 align-items-end">
            <div class="col-lg-6">
                <div class="section-header text-start mb-5 wow fadeInUp" data-wow-delay="0.1s" style="max-width: 500px;">
                    <h1 class="display-5 mb-3">Our Recipes</h1>
                </div>
            </div>
            <div class="col-lg-3 text-start text-lg-end wow slideInRight" data-wow-delay="0.1s">
                <form action="search" method="post">
                    {% csrf_token %}
                <div class="input-group w-100 mx-auto d-flex">
                    <input type="search" class="form-control" name="title" placeholder="keywords" aria-describedby="search-icon-1">
                    <button type="submit"><span id="search-icon-1" class="input-group-text p-3"><i class="fa fa-search"></i></span></button>
                </div>
                </form><br><br>
                
            </div>
            <div class="col-lg-3 text-start text-lg-end wow slideInRight" data-wow-delay="0.1s">
                <form action="search2" method="post">
                    {% csrf_token %}
                <div class="input-group w-100 mx-auto d-flex">
                    <select name="title" id="">
                        <option value="Veg">Veg</option>
                        <option value="Non-Veg">Non-Veg</option>
                    </select>
                    <button type="submit"><span id="search-icon-1" class="input-group-text p-3"><i class="fa fa-search"></i></span></button>
                </div>
                </form><br><br>
                
            </div>
        </div>
        <div class="tab-content">
            <div id="tab-1" class="tab-pane fade show p-0 active">
                <div class="row g-4">


                    {% for i in result %}
                    <div class="col-xl-3 col-lg-4 col-md-6 wow fadeInUp" data-wow-delay="0.1s">
                        <div class="product-item">
                            <div class="position-relative bg-light overflow-hidden">
                                <img class="img-fluid w-100" style="height: 250px; width: 300px;" src="media/{{i.item_image}}" alt="">
                                <div class="bg-secondary rounded text-white position-absolute start-0 top-0 m-4 py-1 px-3">New</div>
                            </div>
                            <div class="text-center p-4">
                                <a class="d-block h5 mb-2" href="">{{i.item_name}}</a>
                                <div class="description-scroll">
                                    <p class="item-description">{{i.item_desc}}</p>
                                </div>
                            </div>
                            <div class="d-flex border-top">
                                <small class="w-50 text-center border-end py-2">
                                    <a class="text-body" href="view_item_recipes/{{i.id}}"><i class="fa fa-eye text-primary me-2"></i>View Recipe</a>
                                </small>
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                   




                  
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Product End -->
    
{% include 'footer.html' %}

{% endblock %}
